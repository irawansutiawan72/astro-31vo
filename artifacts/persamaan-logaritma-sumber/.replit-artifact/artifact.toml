kind = "slides"
previewPath = "/persamaan-logaritma-sumber/"
title = "Persamaan Logaritma — Sumber Guru"
description = "Imported reference presentation for developing original SMA learning content on logarithmic equations in the Numatik app."
version = "1.0.0"
id = "artifacts/persamaan-logaritma-sumber"
router = "path"

[[services]]
name = "web"
paths = [ "/persamaan-logaritma-sumber/" ]
localPort = 18291

[services.development]
run = "pnpm --filter @workspace/persamaan-logaritma-sumber run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/persamaan-logaritma-sumber", "run", "build" ]
serve = "static"
publicDir = "artifacts/persamaan-logaritma-sumber/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18291"
BASE_PATH = "/persamaan-logaritma-sumber/"
