<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" role="img" aria-labelledby="title desc">
  <title id="title">Balok tersusun dari kubus-kubus satuan</title>
  <desc id="desc">Balok berukuran enam kubus lebar, enam kubus dalam, dan empat kubus tinggi.</desc>

  <polygon points="100,220 520,220 700,40 280,40" fill="#fff8df"/>
  <polygon points="520,220 700,40 700,320 520,500" fill="#efe5c7"/>
  <polygon points="100,220 520,220 520,500 100,500" fill="#fff4d4"/>

  <g fill="none" stroke="#245a91" stroke-width="4" stroke-linejoin="round">
    <!-- Front face: 6 columns × 4 rows -->
    <path d="M170 220V500 M240 220V500 M310 220V500 M380 220V500 M450 220V500"/>
    <path d="M100 290H520 M100 360H520 M100 430H520"/>

    <!-- Top face: 6 columns × 6 rows -->
    <path d="M130 190L310 10 M200 220L380 40 M270 220L450 40 M340 220L520 40 M410 220L590 40 M480 220L660 40"/>
    <path d="M100 190H520 M130 160H550 M160 130H580 M190 100H610 M220 70H640"/>

    <!-- Right face: 6 columns × 4 rows -->
    <path d="M550 190L550 470 M580 160L580 440 M610 130L610 410 M640 100L640 380 M670 70L670 350"/>
    <path d="M520 290L700 110 M520 360L700 180 M520 430L700 250"/>

    <!-- Outer silhouette -->
    <path d="M100 220L280 40H700V320L520 500H100Z"/>
    <path d="M520 220L700 40 M520 500L700 320"/>
  </g>
</svg>