<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Prisma segitiga siku-siku</title>
  <desc id="desc">Prisma tegak dengan alas segitiga siku-siku bersisi 5 cm, 12 cm, dan 13 cm serta tinggi prisma 20 cm.</desc>
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" rx="28" fill="#f8fafc"/>
  <g stroke="#1e4f85" stroke-width="6" stroke-linejoin="round">
    <polygon points="170,390 170,170 390,390" fill="url(#front)"/>
    <polygon points="390,390 390,170 610,110 610,330" fill="url(#side)"/>
    <polygon points="170,170 390,170 610,110 390,390" fill="#bfdbfe"/>
    <path d="M170 390H390L610 330" fill="none"/>
    <path d="M170 170L390 170L610 110" fill="none"/>
    <path d="M390 170V390" fill="none"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#173b63" font-weight="700">
    <text x="400" y="55" text-anchor="middle" font-size="28">Prisma segitiga siku-siku</text>
    <text x="285" y="420" text-anchor="middle" font-size="24">12 cm</text>
    <text x="148" y="280" text-anchor="end" font-size="24">5 cm</text>
    <text x="505" y="190" text-anchor="middle" font-size="24" transform="rotate(-15 505 190)">20 cm</text>
    <text x="400" y="485" text-anchor="middle" font-size="21">sisi miring alas = 13 cm</text>
  </g>
  <path d="M190 370V350H210" fill="none" stroke="#1e4f85" stroke-width="4"/>
</svg>