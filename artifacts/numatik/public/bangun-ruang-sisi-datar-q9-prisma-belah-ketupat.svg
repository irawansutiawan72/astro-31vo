<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="title desc">
  <title id="title">Prisma dengan alas belah ketupat</title>
  <desc id="desc">Prisma tegak dengan alas belah ketupat berd diagonal 10 cm dan 24 cm serta tinggi prisma 15 cm.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="540" rx="28" fill="#f8fafc"/>
  <g stroke="#1e4f85" stroke-width="6" stroke-linejoin="round">
    <polygon points="130,205 300,105 520,170 350,270" fill="url(#top)"/>
    <polygon points="130,205 350,270 350,450 130,385" fill="url(#front)"/>
    <polygon points="350,270 520,170 520,350 350,450" fill="#fcd34d"/>
    <path d="M130 205L350 270L520 170" fill="none"/>
    <path d="M130 385L350 450L520 350" fill="none"/>
  </g>
  <g stroke="#2563a6" stroke-width="4" fill="none" stroke-dasharray="9 7">
    <path d="M240 155L410 220"/>
    <path d="M350 105V270"/>
    <path d="M350 270L350 450"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#173b63" font-weight="700">
    <text x="400" y="52" text-anchor="middle" font-size="28">Prisma alas belah ketupat</text>
    <text x="350" y="92" text-anchor="middle" font-size="23">diagonal 24 cm</text>
    <text x="385" y="235" text-anchor="middle" font-size="23" transform="rotate(16 385 235)">diagonal 10 cm</text>
    <text x="560" y="275" text-anchor="middle" font-size="23" transform="rotate(90 560 275)">tinggi 15 cm</text>
    <text x="400" y="505" text-anchor="middle" font-size="21">luas permukaan prisma</text>
  </g>
</svg>