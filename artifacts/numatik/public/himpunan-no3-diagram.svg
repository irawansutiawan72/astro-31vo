<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Diagram Venn soal Himpunan nomor 3</title>
  <desc id="desc">Diagram Venn dengan himpunan B dan C. Bagian B saja berisi 1, 3, 9; irisan berisi 2, 6, 7; bagian C saja berisi 5, 8.</desc>
  <rect width="800" height="520" fill="#ffffff"/>
  <rect x="30" y="25" width="740" height="470" rx="20" fill="#f8fafc" stroke="#334155" stroke-width="5"/>
  <text x="58" y="70" fill="#0f172a" font-family="Arial, sans-serif" font-size="30" font-weight="700">S</text>

  <circle cx="320" cy="265" r="170" fill="#bfdbfe" fill-opacity=".68" stroke="#1d4ed8" stroke-width="5"/>
  <circle cx="480" cy="265" r="170" fill="#fbcfe8" fill-opacity=".68" stroke="#be185d" stroke-width="5"/>

  <text x="202" y="120" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="32" font-weight="700">B</text>
  <text x="534" y="120" fill="#9d174d" font-family="Arial, sans-serif" font-size="32" font-weight="700">C</text>

  <text x="225" y="255" text-anchor="middle" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="28" font-weight="600">1, 3, 9</text>
  <text x="400" y="250" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">2, 6, 7</text>
  <text x="575" y="255" text-anchor="middle" fill="#9d174d" font-family="Arial, sans-serif" font-size="28" font-weight="600">5, 8</text>
</svg>